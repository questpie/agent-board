<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>agent-board · share</title>
		<meta name="robots" content="noindex" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			/* QUESTPIE neutral tokens — mirror src/web/styles.css (dark). */
			:root {
				color-scheme: dark;
				--background: #121212;
				--foreground: #ececec;
				--foreground-muted: #a0a0a0;
				--foreground-subtle: #737373;
				--surface: #161616;
				--surface-low: #1b1b1b;
				--surface-mid: #222222;
				--card: #1b1b1b;
				--primary: #b700ff;
				--border-subtle: #262626;
				--border: #343434;
				--border-strong: #4a4a4a;
				--ring: #737373;
				--font-sans: "Geist", "Inter", system-ui, sans-serif;
				--font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
				--radius-inner: 8px;
				--radius-control: 12px;
				--st-todo: #a0a0a0;
				--st-ready: #60a5fa;
				--st-in_progress: #eab308;
				--st-blocked: #ff5f6d;
				--st-review: #22c55e;
				--st-done: #818cf8;
				--st-draft: #a0a0a0;
				--syntax-string: #7ddf9e;
				--syntax-function: #8fc8ff;
				--syntax-number: #f2ca72;
				--syntax-keyword: #c79bff;
				--syntax-type: #aeb8ff;
				--syntax-comment: #737373;
				--syntax-punctuation: #a0a0a0;
			}
			* { box-sizing: border-box; }
			html, body { margin: 0; height: 100%; }
			body {
				display: flex;
				flex-direction: column;
				font-family: var(--font-sans);
				background: var(--background);
				color: var(--foreground);
				font-size: 14px;
				line-height: 1.6;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}
			a { color: inherit; }
			::selection { background: color-mix(in srgb, var(--primary) 28%, transparent); }

			/* ---- top bar ---- */
			.bar {
				flex: none;
				display: flex;
				align-items: center;
				gap: 14px;
				padding: 10px 16px;
				background: var(--surface);
				border-bottom: 1px solid var(--border-subtle);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 8px;
				font-weight: 600;
				letter-spacing: -0.01em;
				text-decoration: none;
				color: var(--foreground);
			}
			.brand .dot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				background: var(--primary);
				box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent);
			}
			.brand small {
				font-family: var(--font-mono);
				font-size: 10px;
				font-weight: 500;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--foreground-subtle);
			}
			.bar-meta { display: flex; align-items: center; gap: 10px; min-width: 0; }
			.bar-title {
				min-width: 0;
				font-weight: 500;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.badge {
				flex: none;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				padding: 2px 9px;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: var(--surface-mid);
				font-family: var(--font-mono);
				font-size: 11px;
				letter-spacing: 0.03em;
				text-transform: uppercase;
				color: var(--foreground-muted);
			}
			.badge .swatch { width: 7px; height: 7px; border-radius: 50%; background: var(--st-draft); }
			.spacer { flex: 1; }
			.bar-link {
				flex: none;
				padding: 6px 12px;
				border-radius: var(--radius-control);
				border: 1px solid var(--border);
				background: var(--surface-mid);
				color: var(--foreground);
				text-decoration: none;
				font-size: 13px;
				transition: background 120ms, border-color 120ms;
			}
			.bar-link:hover { background: var(--surface-mid); border-color: var(--border-strong); }

			/* ---- content ---- */
			#content { flex: 1; min-height: 0; overflow: auto; }
			body.is-design #content { overflow: hidden; }
			.frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

			.state {
				height: 100%;
				display: grid;
				place-content: center;
				gap: 10px;
				text-align: center;
				padding: 32px;
				color: var(--foreground-muted);
			}
			.state h1 { margin: 0; font-size: 18px; color: var(--foreground); font-weight: 600; }
			.state p { margin: 0; max-width: 38ch; }
			.state a { color: var(--st-ready); }
			.spinner {
				width: 22px; height: 22px; margin: 0 auto;
				border: 2px solid var(--border); border-top-color: var(--primary);
				border-radius: 50%; animation: spin 0.7s linear infinite;
			}
			@keyframes spin { to { transform: rotate(360deg); } }

			/* ---- markdown article ---- */
			.prose { max-width: 820px; margin: 0 auto; padding: 36px 24px 120px; }
			.prose > :first-child { margin-top: 0; }
			.prose h1, .prose h2, .prose h3, .prose h4 {
				line-height: 1.25; letter-spacing: -0.01em; margin: 1.8em 0 0.6em;
			}
			.prose h1 { font-size: 26px; }
			.prose h2 { font-size: 20px; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-subtle); }
			.prose h3 { font-size: 16px; }
			.prose p, .prose ul, .prose ol, .prose blockquote, .prose table { margin: 0 0 1em; }
			.prose a { color: var(--st-ready); text-decoration: none; }
			.prose a:hover { text-decoration: underline; }
			.prose ul, .prose ol { padding-left: 1.5em; }
			.prose li { margin: 0.25em 0; }
			.prose code {
				font-family: var(--font-mono); font-size: 0.88em;
				background: var(--surface-mid); padding: 0.15em 0.4em; border-radius: 6px;
			}
			.prose pre {
				background: var(--surface-low); border: 1px solid var(--border-subtle);
				border-radius: var(--radius-inner); padding: 14px 16px; overflow: auto; margin: 0 0 1.2em;
			}
			.prose pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
			.prose blockquote {
				margin-left: 0; padding: 0.2em 1em; color: var(--foreground-muted);
				border-left: 3px solid var(--border-strong);
			}
			.prose table { border-collapse: collapse; width: 100%; font-size: 13px; }
			.prose th, .prose td { border: 1px solid var(--border-subtle); padding: 7px 11px; text-align: left; }
			.prose th { background: var(--surface-mid); }
			.prose hr { border: none; border-top: 1px solid var(--border-subtle); margin: 2em 0; }
			.prose img { max-width: 100%; border-radius: var(--radius-inner); }
			.prose input[type="checkbox"] { margin-right: 0.5em; }

			@media (max-width: 600px) {
				.brand small, .bar-title { display: none; }
				.prose { padding: 24px 16px 96px; }
			}
		</style>
		<script src="marked.min.js"></script>
	</head>
	<body>
		<header class="bar">
			<a class="brand" href="https://github.com/questpie/agent-board" target="_blank" rel="noopener">
				<span class="dot"></span>agent-board<small>share</small>
			</a>
			<div id="bar-meta" class="bar-meta"></div>
			<span class="spacer"></span>
			<a id="gist-link" class="bar-link" target="_blank" rel="noopener" hidden>Open gist</a>
		</header>
		<main id="content">
			<div class="state"><div class="spinner"></div><p>Loading share…</p></div>
		</main>

		<script>
			marked.setOptions({ gfm: true, breaks: false });

			const content = document.getElementById("content");
			const barMeta = document.getElementById("bar-meta");
			const gistLink = document.getElementById("gist-link");

			const STATUS_COLORS = {
				todo: "--st-todo", ready: "--st-ready", in_progress: "--st-in_progress",
				blocked: "--st-blocked", review: "--st-review", done: "--st-done", draft: "--st-draft",
			};

			function getId() {
				const hash = location.hash.replace(/^#/, "").trim();
				if (hash) return decodeURIComponent(hash);
				return new URLSearchParams(location.search).get("gist") || "";
			}

			function escapeHtml(value) {
				return String(value).replace(/[&<>"']/g, (ch) =>
					({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch],
				);
			}

			function showState(title, bodyHtml) {
				document.body.classList.remove("is-design");
				content.innerHTML = `<div class="state"><h1>${escapeHtml(title)}</h1>${bodyHtml || ""}</div>`;
			}

			async function fileText(file) {
				if (!file) return "";
				if (file.truncated) {
					const res = await fetch(file.raw_url);
					if (!res.ok) throw new Error("Could not load the shared file.");
					return res.text();
				}
				return file.content;
			}

			function renderBar(meta, gist) {
				const parts = [`<span class="badge">${escapeHtml(meta.kind)}</span>`];
				const status = meta.status || (meta.kind === "design" ? "draft" : "");
				if (status) {
					const color = STATUS_COLORS[status] || "--foreground-muted";
					parts.push(
						`<span class="badge"><span class="swatch" style="background:var(${color})"></span>${escapeHtml(status)}</span>`,
					);
				}
				parts.push(`<span class="bar-title">${escapeHtml(meta.title || "")}</span>`);
				barMeta.innerHTML = parts.join("");
				if (gist?.html_url) {
					gistLink.href = gist.html_url;
					gistLink.hidden = false;
				}
			}

			async function renderDesign(meta, gist) {
				const html = await fileText(gist.files[meta.htmlFile || "index.html"]);
				document.body.classList.add("is-design");
				const frame = document.createElement("iframe");
				frame.className = "frame";
				frame.setAttribute(
					"sandbox",
					"allow-scripts allow-same-origin allow-popups allow-forms allow-modals",
				);
				frame.srcdoc = html;
				content.replaceChildren(frame);
			}

			async function renderMarkdown(meta, gist) {
				const md = await fileText(gist.files[meta.bodyFile]);
				document.body.classList.remove("is-design");
				content.innerHTML = `<article class="prose">${marked.parse(md)}</article>`;
			}

			async function main() {
				const id = getId();
				if (!id) {
					showState(
						"agent-board share viewer",
						'<p>Open a share link to view it — they look like <code>…/share/#&lt;id&gt;</code>. Create one with <code>agent-board share &lt;kind&gt; &lt;id&gt;</code>.</p>',
					);
					return;
				}
				let gist;
				try {
					const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(id)}`);
					if (res.status === 403)
						throw new Error("GitHub's API rate limit was reached for your network. Try again shortly, or open the gist directly.");
					if (res.status === 404) throw new Error("This share could not be found — it may have been deleted.");
					if (!res.ok) throw new Error(`Could not load this share (HTTP ${res.status}).`);
					gist = await res.json();
				} catch (error) {
					showState("Can’t load this share", `<p>${escapeHtml(error.message)}</p>`);
					return;
				}

				let meta;
				try {
					meta = JSON.parse(await fileText(gist.files["share.json"]));
					if (!meta || typeof meta !== "object" || !meta.kind) throw new Error("not a share");
				} catch {
					showState(
						"Not an agent-board share",
						`<p>This gist doesn’t contain share metadata. <a href="${escapeHtml(gist?.html_url || "#")}" target="_blank" rel="noopener">Open it on GitHub</a>.</p>`,
					);
					return;
				}

				document.title = `${meta.title || "Shared"} · agent-board`;
				renderBar(meta, gist);
				try {
					if (meta.kind === "design") await renderDesign(meta, gist);
					else await renderMarkdown(meta, gist);
				} catch (error) {
					showState("Couldn’t render this share", `<p>${escapeHtml(error.message)}</p>`);
				}
			}

			window.addEventListener("hashchange", main);
			main();
		</script>
	</body>
</html>
